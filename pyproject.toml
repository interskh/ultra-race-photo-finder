[project]
name = "ultra-race-photo-finder"
version = "0.1.0"
description = "Find your own photos in Chinese race-photo galleries (yipai360, photoplus, pailixiang, xxpie) by clothing, bib, time and scene"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Kyle Sun", email = "interskh@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "boxmot>=25.0.0",
    "fastapi>=0.141.1",
    "httpx",
    "numpy>=2.5.3",
    "ocrmac>=1.0.1",
    "open-clip-torch>=3.3.0",
    "pillow>=12.3.0",
    "psutil>=7.2.2",
    "python-multipart>=0.0.32",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "transformers>=5.17.0",
    "ultralytics>=8.4.157",
    "uvicorn>=0.53.0",
]

[project.scripts]
photofinder = "photofinder.cli:main"

[build-system]
requires = ["uv_build>=0.9.27,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest",
]

[tool.uv.build-backend]
module-name = "photofinder"
